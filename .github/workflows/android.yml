name: Build LIFE OS APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      - name: Publish GitHub Release (latest debug build)
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LifeOS-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug LifeOS-debug.apk --prerelease \
            --title "LIFE OS - latest debug build" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Install on Android 8.0+."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
